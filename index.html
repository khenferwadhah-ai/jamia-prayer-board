<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة مواقيت الصلاة – جمعية مسك الختام</title>
  <style>
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      text-align: center;
    }

    .board {
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background: rgba(0,0,0,0.45);
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      color: gold;
    }

    .clock {
      font-size: 42px;
      font-weight: bold;
      margin: 15px 0;
      border: 2px solid #fff;
      border-radius: 12px;
      padding: 10px;
      display: inline-block;
      min-width: 200px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 18px;
    }

    th, td {
      padding: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    th {
      color: #ffd700;
    }

    .next {
      margin-top: 20px;
      font-size: 20px;
      color: #00ffcc;
    }
  </style>
</head>

<body>
  <div class="board">
    <h1>جمعية مسك الختام الخيرية</h1>
    <div>القرارم قوقة – ولاية ميلة</div>

    <div class="clock" id="clock">--:--:--</div>

    <table>
      <tr><th>الصلاة</th><th>الوقت</th></tr>
      <tr><td>الفجر</td><td id="fajr">--:--</td></tr>
      <tr><td>الظهر</td><td id="dhuhr">--:--</td></tr>
      <tr><td>العصر</td><td id="asr">--:--</td></tr>
      <tr><td>المغرب</td><td id="maghrib">--:--</td></tr>
      <tr><td>العشاء</td><td id="isha">--:--</td></tr>
    </table>

    <div class="next" id="nextPrayer">جاري تحميل المواقيت…</div>
  </div>

  <script>
    // تحديث الساعة الرقمية كل ثانية
    function updateClock() {
      const now = new Date();
      document.getElementById("clock").innerText =
        now.toLocaleTimeString("ar-DZ");
    }
    setInterval(updateClock, 1000);
    updateClock();

    // تحميل مواقيت الصلاة من API (الإحداثيات دقيقة للقرارم)
    async function loadPrayerTimes() {
      try {
        const res = await fetch(
          "https://api.aladhan.com/v1/timingsByCoordinates?latitude=36.448&longitude=6.262&method=4&school=0"
        );
        const data = await res.json();
        const t = data.data.timings;

        document.getElementById("fajr").innerText = t.Fajr;
        document.getElementById("dhuhr").innerText = t.Dhuhr;
        document.getElementById("asr").innerText = t.Asr;
        document.getElementById("maghrib").innerText = t.Maghrib;
        document.getElementById("isha").innerText = t.Isha;

        // العد التنازلي للصلاة القادمة
        setInterval(() => {
          const now = new Date();
          const prayers = [
            {name:"الفجر", time:t.Fajr},
            {name:"الظهر", time:t.Dhuhr},
            {name:"العصر", time:t.Asr},
            {name:"المغرب", time:t.Maghrib},
            {name:"العشاء", time:t.Isha}
          ];
          let nextPrayer = null;
          for(let p of prayers){
            const [h,m] = p.time.split(":");
            const prayerTime = new Date();
            prayerTime.setHours(parseInt(h),parseInt(m),0,0);
            if(now<prayerTime){nextPrayer=p;break;}
          }
          if(nextPrayer){
            const [h,m] = nextPrayer.time.split(":");
            const prayerTime = new Date();
            prayerTime.setHours(parseInt(h),parseInt(m),0,0);
            const diff = prayerTime-now;
            const diffH = Math.floor(diff/3600000);
            const diffM = Math.floor((diff%3600000)/60000);
            const diffS = Math.floor((diff%60000)/1000);
            document.getElementById("nextPrayer").innerText=
              `الصلاة القادمة: ${nextPrayer.name} بعد ${diffH} ساعة و${diffM} دقيقة و${diffS} ثانية`;
          } else {
            document.getElementById("nextPrayer").innerText="الصلاة القادمة: الفجر غدًا";
          }
        },1000);

      } catch(err){
        console.log(err);
        document.getElementById("nextPrayer").innerText="خطأ في تحميل المواقيت";
      }
    }

    loadPrayerTimes();
  </script>
</body>
</html>
